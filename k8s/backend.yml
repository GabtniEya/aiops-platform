apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: aiops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: demo-app:local
          imagePullPolicy: Never
          env:
            - name: DATABASE_URL
              value: postgresql://aiops:aiops@postgres:5432/aiops
            - name: REDIS_HOST
              value: redis
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: aiops
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000