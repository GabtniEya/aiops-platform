name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installer les dépendances
        run: pip install -r demo-app/requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check demo-app

      - name: Tests (pytest)
        working-directory: demo-app
        run: pytest

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image Docker
        run: docker build -t demo-app ./demo-app